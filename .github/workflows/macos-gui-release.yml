name: Native macOS GUI release
on:
  push:
    tags: ['gui-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'GUI version matching macos/GUI_VERSION (for example 0.1.0)'
        required: true
permissions:
  contents: write
concurrency:
  group: macos-gui-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - name: Install shared manager dependencies
        run: npm ci
      - name: Prepare publisher configuration
        env:
          SIGNING_KEY: ${{ secrets.DREAMSKIN_GUI_SIGNING_KEY }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < macos/GUI_VERSION)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_NAME" = "gui-v$version"
          else
            test "$REQUESTED_VERSION" = "$version"
          fi
          test -n "$SIGNING_KEY"
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/gui-signing-key.pem"
          echo "DREAMSKIN_GUI_SIGNING_KEY_FILE=$RUNNER_TEMP/gui-signing-key.pem" >> "$GITHUB_ENV"
          echo "GUI_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build universal shared manager
        env:
          # Keep the repository identity expected by installed signed updaters.
          DREAMSKIN_UPDATE_REPOSITORY: xxloocee/Codex-Dream-Skin-Manager
        run: |
          DREAMSKIN_ARCHS='arm64 x86_64' bash macos/scripts/build-app.sh --output "$RUNNER_TEMP/package/Dream Skin.app"
      - name: Package and sign update manifest
        run: |
          mkdir -p dist-gui
          ditto -c -k --keepParent "$RUNNER_TEMP/package/Dream Skin.app" "dist-gui/DreamSkin-$GUI_VERSION-universal.zip"
          # Signed update clients require the legacy archive and app root names.
          mkdir -p "$RUNNER_TEMP/update-package"
          ditto "$RUNNER_TEMP/package/Dream Skin.app" "$RUNNER_TEMP/update-package/Codex Dream Skin.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/update-package/Codex Dream Skin.app" "dist-gui/CodexDreamSkin-$GUI_VERSION-arm64.zip"
          cp "dist-gui/CodexDreamSkin-$GUI_VERSION-arm64.zip" "dist-gui/CodexDreamSkin-$GUI_VERSION-x64.zip"
          "$RUNNER_TEMP/package/Dream Skin.app/Contents/Resources/runtime/node/node" macos/scripts/publish-gui-manifest.mjs "$GUI_VERSION" dist-gui
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "gui-v$GUI_VERSION" dist-gui/* --target "$GITHUB_SHA" --title "Dream Skin for Mac $GUI_VERSION" --notes "下载安装请选择 DreamSkin-$GUI_VERSION-universal.zip，解压后应用名称为 Dream Skin，支持苹果芯片和 Intel。主题数据单独存储并保留。" --latest=false
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/gui-signing-key.pem"
