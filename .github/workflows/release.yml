name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out release candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate release tag and metadata
        id: version
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $tag"
          }
          $version = $Matches[1]
          $assemblyInfo = Get-Content -LiteralPath 'src\AssemblyInfo.cs' -Raw
          if ($assemblyInfo -notmatch 'AssemblyInformationalVersion\("([^\"]+)"\)') {
            throw 'AssemblyInformationalVersion is missing.'
          }
          if ($Matches[1] -ne $version) {
            throw "Tag version ($version) does not match AssemblyInformationalVersion ($($Matches[1]))."
          }
          foreach ($versionPath in @('windows\VERSION', 'macos\VERSION')) {
            $runtimeVersion = (Get-Content -LiteralPath $versionPath -Raw).Trim()
            if ($runtimeVersion -ne $version) {
              throw "$versionPath ($runtimeVersion) does not match tag version ($version)."
            }
          }
          $packageVersion = (Get-Content -LiteralPath 'macos\package.json' -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $version) {
            throw "macos/package.json ($packageVersion) does not match tag version ($version)."
          }
          $readme = Get-Content -LiteralPath 'README.md' -Raw -Encoding UTF8
          $readmeVersionMatch = [regex]::Match($readme, '(?m)^\s*.*?`(\d+\.\d+\.\d+)`')
          if (-not $readmeVersionMatch.Success -or $readmeVersionMatch.Groups[1].Value -ne $version) {
            throw "README current version does not match tag version ($version)."
          }
          $expectedAssets = @(
            "CodexDreamSkinManager-v$version-windows-x64-setup.exe",
            "CodexDreamSkinManager-v$version-windows-x64-portable.zip",
            "CodexDreamSkinManager-v$version-macos-x64.dmg",
            "CodexDreamSkinManager-v$version-macos-arm64.dmg",
            'SHA256SUMS.txt'
          )
          foreach ($asset in $expectedAssets) {
            if (-not $readme.Contains($asset)) {
              throw "README download name is missing: $asset"
            }
          }
          $notes = ".github\release-notes\$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes are missing: $notes"
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must point to a commit contained in origin/main.'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out release candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up packaged Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          architecture: x64

      - name: Check synchronized cross-platform runtime assets
        shell: bash
        run: node tools/sync-runtime-assets.mjs --check

      - name: Test and build Windows package
        shell: powershell
        run: |
          .\build.ps1 `
            -SkillRoot (Join-Path $PWD 'windows') `
            -NodeExecutable (Get-Command node.exe).Source

      - name: Create Windows portable archive
        shell: powershell
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: .\tools\package-release.ps1 -Version $env:RELEASE_VERSION

      - name: Prepare Inno Setup
        shell: powershell
        run: .\tools\prepare-inno-setup.ps1 | Out-Null

      - name: Create Windows installer
        shell: powershell
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          .\tools\package-installer.ps1 `
            -Version $env:RELEASE_VERSION `
            -IsccPath (Join-Path $PWD 'build\.tools\InnoSetup\ISCC.exe')

      - name: Upload Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: |
            dist/*-windows-x64-portable.zip
            dist/*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: arm64
            runner: macos-14
          - arch: x64
            target: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40

    steps:
      - name: Check out release candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2

      - name: Check synchronized cross-platform runtime assets
        run: node tools/sync-runtime-assets.mjs --check

      - name: Test and build macOS DMG
        env:
          CODEX_DREAM_SKIN_SKIP_SIGNED_RUNTIME_TESTS: "1"
          CODEX_DREAM_SKIN_SKIP_DOCTOR: "1"
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          DREAMSKIN_ARCHS: ${{ matrix.target }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          NODE="$(command -v node)" bash macos/scripts/build-dmg.sh
          mv "macos/release/CodexDreamSkin-v${RELEASE_VERSION}.dmg" \
            "macos/release/CodexDreamSkinManager-v${RELEASE_VERSION}-macos-${RELEASE_ARCH}.dmg"

      - name: Upload macOS release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: macos/release/*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [validate, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release notes
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create SHA-256 manifest
        working-directory: dist
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          expected=(
            "CodexDreamSkinManager-v${RELEASE_VERSION}-windows-x64-setup.exe"
            "CodexDreamSkinManager-v${RELEASE_VERSION}-windows-x64-portable.zip"
            "CodexDreamSkinManager-v${RELEASE_VERSION}-macos-x64.dmg"
            "CodexDreamSkinManager-v${RELEASE_VERSION}-macos-arm64.dmg"
          )
          diff -u <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) \
            <(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          sha256sum "${expected[@]}" | LC_ALL=C sort -k2 > SHA256SUMS.txt

      - name: Create static update manifest
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: python3 tools/create-update-manifest.py --tag "$RELEASE_TAG" --directory dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          notes=".github/release-notes/${RELEASE_TAG}.md"
          mapfile -t assets < <(find dist -maxdepth 1 -type f -printf '%p\n' | LC_ALL=C sort)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --title "Codex Dream Skin Manager v${RELEASE_VERSION}" \
              --notes-file "$notes" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "Codex Dream Skin Manager v${RELEASE_VERSION}" \
              --notes-file "$notes" \
              --repo "$GITHUB_REPOSITORY"
          fi
