name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out manager
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up packaged Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          architecture: x64

      - name: Check synchronized cross-platform runtime assets
        shell: bash
        run: node tools/sync-runtime-assets.mjs --check

      - name: Validate release tag
        id: version
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $tag"
          }
          $version = $Matches[1]
          $assemblyInfo = Get-Content -LiteralPath 'src\AssemblyInfo.cs' -Raw
          if ($assemblyInfo -notmatch 'AssemblyInformationalVersion\("([^\"]+)"\)') {
            throw 'AssemblyInformationalVersion is missing.'
          }
          if ($Matches[1] -ne $version) {
            throw "Tag version ($version) does not match AssemblyInformationalVersion ($($Matches[1]))."
          }
          $readme = Get-Content -LiteralPath 'README.md' -Raw -Encoding UTF8
          $readmeVersionMatch = [regex]::Match($readme,
            '(?m)^\s*.*?`(\d+\.\d+\.\d+)`')
          if (-not $readmeVersionMatch.Success) {
            throw 'README current version is missing.'
          }
          $readmeVersion = $readmeVersionMatch.Groups[1].Value
          if ($readmeVersion -ne $version) {
            throw "Tag version ($version) does not match README current version ($readmeVersion)."
          }
          $expectedArchive = "CodexDreamSkinManager-v$version-windows.zip"
          if (-not $readme.Contains($expectedArchive)) {
            throw "README download name does not match the release archive: $expectedArchive"
          }
          $expectedInstaller = "CodexDreamSkinManager-v$version-setup.exe"
          if (-not $readme.Contains($expectedInstaller)) {
            throw "README download name does not match the installer: $expectedInstaller"
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must point to a commit contained in origin/main.'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test and build runnable package
        shell: powershell
        run: |
          .\build.ps1 `
            -SkillRoot (Join-Path $PWD 'windows') `
            -NodeExecutable (Get-Command node.exe).Source

      - name: Create versioned release archive
        shell: powershell
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          .\tools\package-release.ps1 -Version $env:RELEASE_VERSION

      - name: Prepare Inno Setup
        shell: powershell
        run: |
          .\tools\prepare-inno-setup.ps1 | Out-Null

      - name: Create Windows installer
        shell: powershell
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          .\tools\package-installer.ps1 `
            -Version $env:RELEASE_VERSION `
            -IsccPath (Join-Path $PWD 'build\.tools\InnoSetup\ISCC.exe')

      - name: Upload release package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CodexDreamSkinManager-v${{ steps.version.outputs.version }}-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          $archive = "dist\CodexDreamSkinManager-v$version-windows.zip"
          $checksum = "dist\CodexDreamSkinManager-v$version-windows.sha256"
          $installer = "dist\CodexDreamSkinManager-v$version-setup.exe"
          $installerChecksum = "dist\CodexDreamSkinManager-v$version-setup.sha256"
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'SilentlyContinue'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $previousErrorActionPreference
          if ($releaseExists) {
            gh release upload $tag $archive $checksum $installer $installerChecksum `
              --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $archive $checksum $installer $installerChecksum `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title "Codex Dream Skin Manager v$version" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
